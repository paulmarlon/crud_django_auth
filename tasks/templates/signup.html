{% extends "base.html" %}

{% block title %}Registro - Django App{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-primary display-4"></i>
                    <h2 class="h3 mt-2 fw-bold">Crear Cuenta</h2>
                    <p class="text-muted small">Regístrate para empezar a organizar tus tareas</p>
                </div>

                <!-- Formulario de Registro -->
                <form action="{% url 'signup' %}" method="post" novalidate>
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check-circle"></i> Registrarse
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">
                        ¿Ya tienes una cuenta? <a href="{% url 'signin' %}" class="text-decoration-none fw-semibold">Inicia sesión aquí</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
