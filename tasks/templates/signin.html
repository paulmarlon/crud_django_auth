{% extends "base.html" %}

{% block content %}
    <h1>Sign In</h1>
    
    <!-- Bloque para mostrar mensajes en la cabecera -->
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form action="/signin/" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign In</button>
    </form>
{% endblock %}
